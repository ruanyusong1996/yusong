<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>数据看板</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- 顶部标题（内容由「看板配置」决定） -->
  <header class="header-bar">
    <div class="header-decoration-left" id="header-deco-left"></div>
    <div class="header-decoration-right" id="header-deco-right"></div>
    <div class="header-content">
      <h1 class="title-main" id="page-title">—</h1>
      <p class="subtitle" id="page-subtitle"></p>
    </div>
  </header>

  <!-- 主体：模块/列/块全部由配置动态渲染 -->
  <main class="main-container">
    <div id="modules-root"></div>
    <footer class="footer-text" id="page-footer"></footer>
  </main>

  <!-- 详情模态层 -->
  <div id="detail-modal" class="modal-backdrop hidden">
    <div class="modal-panel">
      <div class="modal-header">
        <div>
          <h2 id="modal-title" class="modal-title">明细数据</h2>
          <p id="modal-subtitle" class="modal-subtitle"></p>
        </div>
        <div class="modal-tools">
          <input id="modal-search" type="text" placeholder="搜索..." class="modal-search" />
          <button id="modal-close" class="modal-close">×</button>
        </div>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <!-- 会话失效提示 -->
  <div id="session-mask" class="session-mask hidden">
    <div class="sm-title">登录已过期</div>
    <div class="sm-desc">为保护数据安全，请重新登录后继续查看。</div>
    <button class="sm-btn" id="session-relogin">重新登录</button>
  </div>

  <script src="./lib/echarts.min.js"></script>
  <script src="./seed-config.js"></script>
  <script src="./seed-data.js"></script>
  <script src="./schema.js"></script>
  <script src="./config-engine.js"></script>
  <script src="./data-store.js"></script>
  <script src="./app.js"></script>
</body>
</html>
